#################### Lines from Events ####################

The year is 2050, our glorious nation, the People's Republic of China was in a nuclear war. Luckily, our forefathers constructed a series of defences officially called 'The Third Line Construction' in the 1970s. Nicknamed [The Underground Great Wall]. It was constantly maintained and expanded under tense international conflicts up until the final moment. We have been relying on this legacy for about 20 years. Until now, the radiation level has gone down remarkably and we need to bear the responsibility of raising the red flag again. = 时值公元2050年，我们光荣的祖国——中华人民共和国，曾深陷核战争的炼狱。幸好革命先辈于上世纪七十年代未雨绸缪，营建了官方名号“三线工程”的一整套防御体系，代号 [The Underground Great Wall]。它在国际风云激荡中不断修缮扩建，直至最后关头。二十年来，我们仰仗这份家业艰难度日。如今辐射渐消，天日重开，是时候扛起红旗、重整河山了。
Time to plan our breakout = 是时候谋划破局大计了
You have [10] [Vault Resource] to spend, choose wisely to build a good start. = 你手握 [10] 点 [Vault Resource] 可供支配，务必精打细算，打好开局这一仗。
Remember, it is also an option to conserve resources, which may enable events to have more varied outcomes. = 切记，省吃俭用、留有余地也是一条路；厚积薄发，方能左右逢源、游刃有余。
Fate of China: Emergency Action = 中国之命运·紧急行动

Most of the Military Force has either perished in nuclear attacks or is unable to contact us. Although a plan to scrape the wasteland for possible survivors is in the works, we must ensure we can protect ourselves. = 我军主力，或已于核火中牺牲，或音讯全无、难以联络。虽有搜救幸存者的计划正在酝酿，但当务之急，仍是确保自身无虞、可御外侮。
We need more intelligence before we can make any decisions = 没有情报支持，就没有发言权。
Starting all over again to completely overhaul our military = 破而后立，彻底重塑我军组织。
[The Underground Great Wall] Provides [1] more [Weapon] = [The Underground Great Wall] 额外提供 [1] [Weapon]
[Party Branch] Provides [5] more [Military] units XP in their cities = [Party Branch] 使其所在城市的 [Military] 单位额外获得 [5] 点经验
We can halt overspending on [Military] in order to focus on building up other aspects = 节用军费，把好钢用在刀刃上，全力夯实其他方面。
Fate of China: Military Presence = 中国之命运·军力布局

[The Underground Great Wall] is overflowing with refugees. We have implemented strict rationing, birth control and housing policies to keep the resource spending sustainable. Resettling the surface would alleviate most of these problems, but the problem of keeping morale, security and public safety would take a lot of our focus in the near future. = [The Underground Great Wall] 如今人满为患，难民如潮。为求长治久安，我们厉行配给、节育与住房之策，以保资源细水长流。重返地表，可解燃眉之急；然稳住军心、安定民心、维护治安，亦将耗尽我们的心力。
We need to reclaim our land to create an economic base and some strategic depth first and foremost. Management issues can be discussed later. = 当务之急，是收复故土、建立经济根基、谋取战略纵深；至于治理之道，来日方长，可从长计议。
We need to carefully manage production and population growth to ensure our future growth. = 必须统筹兼顾生产与人口，方能行稳致远、厚植根基。
We must focus on rebuilding our agricultural and water supply base faster than everything else = 必须把重建农业与供水基建放在压倒一切的位置，快马加鞭、只争朝夕。
Fate of China: Resettlement = 中国之命运·重整家园

During our time underground, we still managed to preserve much knowledge about industrial production and receive data about the contaminated surface by sending drones and radio waves. = 蛰居地下这些年，我们仍悉心保留下大量工业生产的宝贵知识，并借助无人机与电波，源源不断地接收地表污染状况的数据情报。
Focus our research efforts on adapting to the new surface condition = 集中攻关，适应地表新环境。
Focus our research efforts on recovering our industrial capability = 集中攻关，恢复工业生产能力。
We cannot sacrifice too many resources on research = 科研不能寅吃卯粮，切不可倾尽资源。
Disable the starting [Science] debuff on every city before [Education] = 在研究 [Education] 之前，解除所有城市初始的 [Science] 减益
Fate of China: Underground Research Progress = 中国之命运·地下科研进展

After all the decisions have been set, Li De Sheng, current Party Chairman of [The Underground Great Wall] facility, let out a long sigh. There is still a long way to go to recover the lost territories, and past glory is meaningless in the face of the brutal reality. He glanced at the wall behind him, where the photo of Marx, Engels, Lenin and Mao resides. = 各项决策尘埃落定。[The Underground Great Wall] 现任党委书记：李德胜长叹一声。收复失地、恢复旧观，仍是任重道远；往昔荣光，在残酷现实面前不过是镜花水月。他回首望了望身后那面墙——马克思、恩格斯、列宁与毛主席的画像，正高悬其上。
We will get there eventually = 路漫漫其修远兮。
Every [Vault Resource] left is converted into [100] [Gold] and [25] [Science] on standard speed. = 标准速度下，每点剩余的 [Vault Resource] 折算为 [100] [Gold] 与 [25] [Science]。
At least I still have reserved powers = 幸好，我还留了一手。
By conserving enough material, you've earned a [Double Event Choice], which means in some progression events you can choose... [2] options at once. = 因你积谷防饥、储备充足，你获得一次 [Double Event Choice]；在若干进程事件中，你将可一次性选择...... [2] 个选项。
Fate of China: Vault Door Opens = 中国之命运·开门

The Vault Door slowly opens. The sunlight leaks through the gaps of the large cog-shaped door. The air is not as dry and dusty as before. The Geiger counter is silent. A group of scouts wearing hazmat suits goes out to finalise something special. = 避难所的大门缓缓开启。阳光穿过那巨型齿轮状门扉的缝隙，倾泻而入。空气不再如往昔那般干燥呛人。盖革计数器寂然无声。一队身着防化服的侦察员鱼贯而出，去落实一桩要事。
First Message: 205X = 第一条讯息·205X
The first thing that he saw was a pile of dirty red cloth lying on the floor outside the main entrance, = 他第一眼看到的，是正门外地上堆着的一团落满尘土的红色破布，
a worn out banner that is barely readable. It says: 'Don't panic, follow instructions'. = 那是一条破旧得几乎辨认不清的横幅，上面写着：“不要惊慌，听从指挥”。
There were many banners, some were still on the walls but this one is on the ground. = 有许多横幅至今仍挂在墙上，唯独这一条，落在了地上。
He remembered it was 20 years ago, when he dragged that thing out of its storage and half-assedly nailed it down there in haste. = 他想起二十年前，自己把这玩意儿从仓库里拖出来，火急火燎、草草钉在了那里。
If not for the suit and gloves on him, he could see the wrinkles on his hands. = 若非这身防护服与手套遮体，他定能瞧见自己满手的皱纹。
And this time he nailed something right. = 而这一回，他终于钉对了一回。
'Welcome to the surface! Comrade.' = “欢迎重返地表！同志。”
Remnant: Surface = 余波·重返地表

As we attempt to establish our surface life again, human civilization has changed all its faces to adapt to the conditions, and opening trade to a bunch of cannibals, mutants and, worst of all, landlords is a fearsome concept that many of us struggle to face. An important general assembly is being held to discuss our attitude toward the wasteland. = 当我们重又在这片大地上立足，人类文明为适应环境早已面目全非。同食人魔、变种人，乃至最令人不齿的地主之流通商往来，这等光景令许多人如鲠在喉、难以面对。一场关乎我们对废土态度的重大全会，正在召开。
Pre-war culture, ideologies and moral standards should give place to pragmatic approaches. = 战前的文化、意识形态与道德准则，当让位于实事求是、务求实效的方针。
New Medium and High [International Reputation] buff: = 新增中、高 [International Reputation] 增益：
Trade, although limited, must be established. And we should also increase our awareness of the danger from infiltration. = 通商往来虽属权宜，却势在必行；同时更要擦亮眼睛，严防渗透之患。
New High [Party Unity] buff: = 新增高 [Party Unity] 增益：
And we can reach an equilibrium with the prior experience of building a mixed economy. = 凭借往昔建设混合经济的经验，我们可以左右兼顾、求得平衡。
Gain both of the buffs above. = 兼得上述两项增益。
Fate of China: Realisation = 中国之命运·觉察

There are many important historical documents and other knowledge in the safe confines of [The Underground Great Wall]. Preserving them was one of our top priorities; now that we have recovered the ability to reproduce copies, what inspiration could we take from them? People need an idea they can get behind, the army needs a goal worth fighting for. = [The Underground Great Wall] 的深宫密室里，珍藏着无数重要史籍文献与知识瑰宝。保全它们，曾是我们的头等大事。如今重获复制刊行之力，我们能从中汲取怎样的启示？人民需要一面可以追随的旗帜，军队需要一个值得为之战斗的目标。
The Great Reunification shall continue! = 统一大业，薪火不灭！
[+25/+50]% Strength against any other self-proclaimed Chinese faction = 对任何自称的华夏势力，战力提升 [+25/+50]%
Chinese civilization will persevere. = 中华文明，生生不息。
[+1/+2] [Science] and [Culture] from each Trade Route = 每条贸易路线提供 [+1/+2] [Science] 与 [Culture]
This is a Protracted War against the totality of capitalism and imperialism's wrongs. = 这是一场针对资本主义及帝国主义全部罪孽的持久战。
We will rebuild the motherland brick by brick. = 重建祖国，一砖一瓦。
Fate of China: Revision = 中国之命运·复习

We can do better = 百尺竿头，更进一步。
There is still a long way ahead = 前路漫漫，来日方长。
Revision:Double Choice Available = 复习·双选可用

Through extensive research and reconstruction, we have revitalised our national defense industry. However, we need to construct a tactical framework to get use out of our military technology. Our generals are arguing at the conference non-stop. = 历经艰苦卓绝的科研与重建，我国国防工业已重焕生机。然则，尚需为我们的军事技术构筑一套战术框架，方能物尽其用。众将帅于会场之上，争得不可开交。
Light infantry and drones would serve as the bulk of the force to rapidly infiltrate the front line. = 当以轻步兵与无人机为骨干，疾如闪电地渗透前线。
And other units will follow through. = 其余部队随后跟进，一鼓作气。
--- = ---
Unlocks [Research Breakthrough: Combat Drone], which constructs [Ground Control Center] early = 解锁 [Research Breakthrough: Combat Drone]，可提前建成 [Ground Control Center]
But has a temporary negative effect on [Power] and [Science] production for [7/10/15/20] turns according to speed. = 但视游戏速度，[Power] 与 [Science] 产出将在 [7/10/15/20] 回合内暂时受挫。
Which is immediately active after selecting this choice. = 选定此选项后立即生效。
We may use this newfound prowess to enhance our guerilla tactics to maximise destruction against enemy attack forces. = 凭借这股新锐之力，我们可大展游击神威，对来犯之敌予以最大限度的重创。
After we have weakened the enemy enough, we will be able to capture their territory without much effort. = 待敌被削弱殆尽，我们便可兵不血刃、轻取敌土。
[No Mercy Cannon] units can now transform to [Artillery] at the cost of [150] [Gold] = [No Mercy Cannon] 单位如今可消耗 [150] [Gold] 转型为 [Artillery]
Re-mechanise as soon as possible. = 争分夺秒，再机械化。
Infantry tactics are not the end-all and be-all. We must have an armored force that can outmaneuver, overwhelm and overpower our opponent quickly to minimise our losses. = 步兵战术并非放之四海而皆准的万应灵丹。我们必须锻造一支能机动、能压制、能决胜的装甲铁流，速战速决，以最小的代价压倒顽敌。
Unlocks [Research Breakthrough: APC], which constructs an [Armor Production Line] in your capital without prerequisite technology = 解锁 [Research Breakthrough: APC]，无需前置科技即可在首都建成 [Armor Production Line]
But have a temporary negative effect on [Power] and [Science] production for [10] turns. = 但 [Power] 与 [Science] 产出将在 [10] 回合内暂时受挫。
Unlocks ['Tiger' APC], a variant of [Armored Car] that is immediately available after the breakthrough = 解锁 ['Tiger' APC]——[Armored Car] 的变种，突破后立即可用
Fate of China: Reforge = 中国之命运·重铸

Reforge: Double Choice Available = 重铸·双选可用

Now that we have a basis to conduct more research, we may choose a field to conduct our breakthrough on recovering what has been lost. = 如今科研根基已立，正可择一领域攻坚突破，追回失落的文明火种。
Environment is what we all share and can't abandon = 绿水青山，是大家共同的家园，绝不能弃之不顾。
Reinstalling the industrial chains is the top priority = 重建产业链，乃当务之急、重中之重。
Really? Without sufficient infrastructure? = 当真？连像样的基建都没有？
Fate of China: Rebuild = 中国之命运·重建

Rebuild: Double Choice Available = 重建·双选可用

Finally, we have completely re-established our military industry to the pre-war baseline. But there is still a critical decision to decide what special punch our army should pack. = 至此，我国军工已彻底恢复至战前水平。然仍有最后一桩要事待决：我军该祭出怎样的杀手锏？
Contingency Plan and Fast Deployment = 应急预案·快速部署
Akin to the pre-war American doctrine of global presence, we must build our own fast reaction force. = 效法战前美国的全球存在之道，我们必须打造自己的快速反应力量。
Unlocks ['Qun Peng' Paratrooper], a variant of [Paratrooper] that has more strength and longer dropping range. = 解锁 ['Qun Peng' Paratrooper]——[Paratrooper] 的变种，战力更强、空降更远。
Unlocks ['Helix' Helicopter], a variant of [Attack Helicopter] that can provide healing to nearby units, which will be unlocked at [Lasers]. = 解锁 ['Helix' Helicopter]——[Attack Helicopter] 的变种，可为邻近单位疗伤，将在 [Lasers] 科技解锁。
Automated Warfare = 无人化战争
Drones, Turrets and Robot Dogs were the toys of last year. We will build a great wall of iron and circuits. = 无人机、炮塔与机器狗，不过是昨日黄花。我们要筑起一道钢铁与电路铸就的新长城。
Unlocks ['Great Wall' Drone Host], a land [Carrier] for special drone units which will be unlocked at [Full-Spectrum Dominance]. = 解锁 ['Great Wall' Drone Host]——供特种无人机单位使用的陆上 [Carrier]，将在 [Full-Spectrum Dominance] 解锁。
Unlocks ['Beacon' Strike Drone], which can only be created with the ['Great Wall' Drone Host], acts as a direct upgrade for [Strike Drone]s, and can intercept enemy aircraft. = 解锁 ['Beacon' Strike Drone]，仅能由 ['Great Wall' Drone Host] 制造，作为 [Strike Drone] 的直接升级，并可拦截敌机。
Strategic Weaponry = 战略武器
CAS, Bomber and Missiles. Pointing at our enemies = 近距支援机、轰炸机与导弹，剑指敌寇。
Unlocks ['Nü Wa' Nuclear Cannon], a variant of [Missile Artillery] that uses tactical nuclear strike as its normal attack. = 解锁 ['Nü Wa' Nuclear Cannon]——[Missile Artillery] 的变种，以战术核打击作为常规攻击手段。
Unlocks [Aunty Qiu Project], a variant of [Manhattan Project] that can be built right after selecting this option. = 解锁 [Aunty Qiu Project]——[Manhattan Project] 的变种，选定此选项后即可开建。
Fate of China: Great Armament = 中国之命运·大国重器

Great Armament: Double Choice Available = 重器·双选可用

The 'confidential' arrives. One after another. Like the Mithraism worshippers building their temple underground thousands of years ago in a bygone era. The bomb successfully detonated underground. Deliberately avoiding causing more fallout on the surface. The chairman lights a cig, much like his predecessor did a century ago. = “绝密”抵达，一件接着一件。宛如数千年前那个遥远时代里，密特拉教徒在地底营建神庙一般。核弹在地底成功引爆，刻意避开了对地表造成更多尘埃。主席点起一根烟，恰似百年前他的前辈那般。
If nuclear war was the ultimate evil. = 若说核战争是万恶之首。
After announcing that the nation has nuclear capabilities, he reaffirmed the stance:  'No first use' Policy will stand. Even after the disaster. = 在宣告国家已拥有核力量之后，他再次重申立场：纵使劫后余生，“不首先使用核武”政策，是中国坚守不移的立场。
Mechanic: Cannot Use Nuclear Weapon when not in a war. = 机制：在正式宣战之前，不可使用核武器。
Then why did we commit it? = 那我们又何必造它？
