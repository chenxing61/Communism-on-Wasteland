Unlocks [Research Breakthrough: Combat Drone], which constructs [Ground Control Center] early = 解鎖 [Research Breakthrough: Combat Drone]，可提前建成 [Ground Control Center]
But has a temporary negative effect on [Power] and [Science] production for [7/10/15/20] turns according to speed. = 但視遊戲速度，[Power] 與 [Science] 產出將在 [7/10/15/20] 回合內暫時受挫。
Which is immediately active after selecting this choice. = 選定此選項後立即生效。
We may use this newfound prowess to enhance our guerilla tactics to maximise destruction against enemy attack forces. = 憑藉這股新銳之力，我們可大展游擊神威，對來犯之敵予以最大限度的重創。
After we have weakened the enemy enough, we will be able to capture their territory without much effort. = 待敵被削弱殆盡，我們便可兵不血刃、輕取敵土。
[No Mercy Cannon] units can now transform to [Artillery] at the cost of [150] [Gold] = [No Mercy Cannon] 單位如今可消耗 [150] [Gold] 轉型為 [Artillery]
Re-mechanise as soon as possible. = 爭分奪秒，再機械化。
Infantry tactics are not the end-all and be-all. We must have an armored force that can outmaneuver, overwhelm and overpower our opponent quickly to minimise our losses. = 步兵戰術並非放之四海而皆準的萬應靈丹。我們必須鍛造一支能機動、能壓制、能決勝的裝甲鐵流，速戰速決，以最小的代價壓倒頑敵。
Unlocks [Research Breakthrough: APC], which constructs an [Armor Production Line] in your capital without prerequisite technology = 解鎖 [Research Breakthrough: APC]，無需前置科技即可在首都建成 [Armor Production Line]
But have a temporary negative effect on [Power] and [Science] production for [10] turns. = 但 [Power] 與 [Science] 產出將在 [10] 回合內暫時受挫。
Unlocks ['Tiger' APC], a variant of [Armored Car] that is immediately available after the breakthrough = 解鎖 ['Tiger' APC]——[Armored Car] 的變種，突破後立即可用
Fate of China: Reforge = 中國之命運·重鑄

Reforge: Double Choice Available = 重鑄·雙選可用

Now that we have a basis to conduct more research, we may choose a field to conduct our breakthrough on recovering what has been lost. = 如今科研根基已立，正可擇一領域攻堅突破，追回失落的文明火種。
Environment is what we all share and can't abandon = 綠水青山，是大家共同的家園，絕不能棄之不顧。
Reinstalling the industrial chains is the top priority = 重建產業鏈，乃當務之急、最重要。
Really? Without sufficient infrastructure? = 當真？連像樣的基建都沒有？
Fate of China: Rebuild = 中國之命運·重建

Rebuild: Double Choice Available = 重建·雙選可用

Finally, we have completely re-established our military industry to the pre-war baseline. But there is still a critical decision to decide what special punch our army should pack. = 至此，我國軍工已徹底恢復至戰前水平。然仍有最後一樁要事待決：我軍該祭出怎樣的殺手鐧？
Contingency Plan and Fast Deployment = 應急預案·快速部署
Akin to the pre-war American doctrine of global presence, we must build our own fast reaction force. = 效法戰前美國的全球存在之道，我們必須打造自己的快速反應力量。
Unlocks ['Qun Peng' Paratrooper], a variant of [Paratrooper] that has more strength and longer dropping range. = 解鎖 ['Qun Peng' Paratrooper]——[Paratrooper] 的變種，戰力更強、空降更遠。
Unlocks ['Helix' Helicopter], a variant of [Attack Helicopter] that can provide healing to nearby units, which will be unlocked at [Lasers]. = 解鎖 ['Helix' Helicopter]——[Attack Helicopter] 的變種，可為鄰近單位療傷，將在 [Lasers] 科技解鎖。
Automated Warfare = 無人化戰爭
Drones, Turrets and Robot Dogs were the toys of last year. We will build a great wall of iron and circuits. = 無人機、炮塔與機器狗，不過是昨日黃花。我們要築起一道鋼鐵與電路鑄就的新長城。
Unlocks ['Great Wall' Drone Host], a land [Carrier] for special drone units which will be unlocked at [Full-Spectrum Dominance]. = 解鎖 ['Great Wall' Drone Host]——供特種無人機單位使用的陸上 [Carrier]，將在 [Full-Spectrum Dominance] 解鎖。
Unlocks ['Beacon' Strike Drone], which can only be created with the ['Great Wall' Drone Host], acts as a direct upgrade for [Strike Drone]s, and can intercept enemy aircraft. = 解鎖 ['Beacon' Strike Drone]，僅能由 ['Great Wall' Drone Host] 製造，作為 [Strike Drone] 的直接升級，並可攔截敵機。
Strategic Weaponry = 戰略武器
CAS, Bomber and Missiles. Pointing at our enemies = 近距支援機、轟炸機與導彈，劍指敵寇。
Unlocks ['Nü Wa' Nuclear Cannon], a variant of [Missile Artillery] that uses tactical nuclear strike as its normal attack. = 解鎖 ['Nü Wa' Nuclear Cannon]——[Missile Artillery] 的變種，以戰術核打擊作為常規攻擊手段。
Unlocks [Aunty Qiu Project], a variant of [Manhattan Project] that can be built right after selecting this option. = 解鎖 [Aunty Qiu Project]——[Manhattan Project] 的變種，選定此選項後即可開建。
Fate of China: Great Armament = 中國之命運·大國重器

Great Armament: Double Choice Available = 重器·雙選可用

The 'confidential' arrives. One after another. Like the Mithraism worshippers building their temple underground thousands of years ago in a bygone era. The bomb successfully detonated underground. Deliberately avoiding causing more fallout on the surface. The chairman lights a cig, much like his predecessor did a century ago. = “絕密”抵達，一件接着一件。宛如數千年前那個遙遠時代裏，密特拉教徒在地底營建神廟一般。核彈在地底成功引爆，刻意避開了對地表造成更多塵埃。主席點起一根煙，恰似百年前他的前輩那般。
If nuclear war was the ultimate evil. = 若說核戰爭是萬惡之首。
