#################### Lines from Events ####################

The year is 2050, our glorious nation, the People's Republic of China was in a nuclear war. Luckily, our forefathers constructed a series of defences officially called 'The Third Line Construction' in the 1970s. Nicknamed [The Underground Great Wall]. It was constantly maintained and expanded under tense international conflicts up until the final moment. We have been relying on this legacy for about 20 years. Until now, the radiation level has gone down remarkably and we need to bear the responsibility of raising the red flag again. = 時值公元2050年，我們光榮的祖國——中華人民共和國，曾深陷核戰爭的煉獄。幸好革命先輩於上世紀七十年代未雨綢繆，營建了官方名號“三線工程”的一整套防禦體系，代號 [The Underground Great Wall]。它在國際風雲激盪中不斷修繕擴建，直至最後關頭。二十年來，我們仰仗這份家業艱難度日。如今輻射漸消，天日重開，是時候扛起紅旗、重整河山了。
Time to plan our breakout = 是時候謀劃破局大計了
You have [10] [Vault Resource] to spend, choose wisely to build a good start. = 你手握 [10] 點 [Vault Resource] 可供支配，務必精打細算，打好開局這一仗。
Remember, it is also an option to conserve resources, which may enable events to have more varied outcomes. = 切記，省吃儉用、留有餘地也是一條路；厚積薄發，方能左右逢源、游刃有餘。
Fate of China: Emergency Action = 中國之命運·緊急行動

Most of the Military Force has either perished in nuclear attacks or is unable to contact us. Although a plan to scrape the wasteland for possible survivors is in the works, we must ensure we can protect ourselves. = 我軍主力，或已於核火中犧牲，或音訊全無、難以聯絡。雖有搜救倖存者的計劃正在醞釀，但當務之急，仍是確保自身無虞、可御外侮。
We need more intelligence before we can make any decisions = 沒有情報支持，就沒有發言權。
Starting all over again to completely overhaul our military = 破而後立，徹底重塑我軍組織。
[The Underground Great Wall] Provides [1] more [Weapon] = [The Underground Great Wall] 額外提供 [3] 點 [Happiness]
[Party Branch] Provides [5] more [Military] units XP in their cities = [Party Branch] 使其所在城市的 [Military] 單位額外獲得 [5] 點經驗
We can halt overspending on [Military] in order to focus on building up other aspects = 節用軍費，把好鋼用在刀刃上，全力夯實其他方面。
Fate of China: Military Presence = 中國之命運·軍力布局

[The Underground Great Wall] is overflowing with refugees. We have implemented strict rationing, birth control and housing policies to keep the resource spending sustainable. Resettling the surface would alleviate most of these problems, but the problem of keeping morale, security and public safety would take a lot of our focus in the near future. = [The Underground Great Wall] 如今人滿為患，難民如潮。為求長治久安，我們厲行配給、節育與住房之策，以保資源細水長流。重返地表，可解燃眉之急；然穩住軍心、安定民心、維護治安，亦將耗盡我們的心力。
We need to reclaim our land to create an economic base and some strategic depth first and foremost. Management issues can be discussed later. = 當務之急，是收復故土、建立經濟根基、謀取戰略縱深；至於治理之道，來日方長，可從長計議。
We need to carefully manage production and population growth to ensure our future growth. = 必須統籌兼顧生產與人口，方能行穩致遠、厚植根基。
We must focus on rebuilding our agricultural and water supply base faster than everything else = 必須把重建農業與供水基建放在壓倒一切的位置，快馬加鞭、只爭朝夕。
Fate of China: Resettlement = 中國之命運·重整家園

During our time underground, we still managed to preserve much knowledge about industrial production and receive data about the contaminated surface by sending drones and radio waves. = 蟄居地下這些年，我們仍悉心保留下大量工業生產的寶貴知識，並借助無人機與電波，源源不斷地接收地表污染狀況的數據情報。
Focus our research efforts on adapting to the new surface condition = 集中攻關，適應地表新環境。
Focus our research efforts on recovering our industrial capability = 集中攻關，恢復工業生產能力。
We cannot sacrifice too many resources on research = 科研不能寅吃卯糧，切不可傾盡資源。
Disable the starting [Science] debuff on every city before [Education] = 在研究 [Education] 之前，解除所有城市初始的 [Science] 減益
Fate of China: Underground Research Progress = 中國之命運·地下科研進展

After all the decisions have been set, Li De Sheng, current Party Chairman of [The Underground Great Wall] facility, let out a long sigh. There is still a long way to go to recover the lost territories, and past glory is meaningless in the face of the brutal reality. He glanced at the wall behind him, where the photo of Marx, Engels, Lenin and Mao resides. = 各項決策塵埃落定。[The Underground Great Wall] 現任黨委書記：李德勝長嘆一聲。收復失地、恢復舊觀，仍是任重道遠；往昔榮光，在殘酷現實面前不過是鏡花水月。他回首望了望身後那面牆——馬克思、恩格斯、列寧與毛主席的畫像，正高懸其上。
We will get there eventually = 路漫漫其修遠兮。
Every [Vault Resource] left is converted into [100] [Gold] and [25] [Science] on standard speed. = 標準速度下，每點剩餘的 [Vault Resource] 折算為 [100] [Gold] 與 [25] [Science]。
At least I still have reserved powers = 幸好，我還留了一手。
By conserving enough material, you've earned a [Double Event Choice], which means in some progression events you can choose... [2] options at once. = 因你積穀防饑、儲備充足，你獲得一次 [Double Event Choice]；在若干進程事件中，你將可一次性選擇...... [2] 個選項。
Fate of China: Vault Door Opens = 中國之命運·開門

The Vault Door slowly opens. The sunlight leaks through the gaps of the large cog-shaped door. The air is not as dry and dusty as before. The Geiger counter is silent. A group of scouts wearing hazmat suits goes out to finalise something special. = 避難所的大門緩緩開啟。陽光穿過那巨型齒輪狀門扉的縫隙，傾瀉而入。空氣不再如往昔那般乾燥嗆人。蓋革計數器寂然無聲。一隊身着防化服的偵察員魚貫而出，去落實一樁要事。
First Message: 205X = 第一條訊息·205X
The first thing that he saw was a pile of dirty red cloth lying on the floor outside the main entrance, = 他第一眼看到的，是正門外地上堆着的一團落滿塵土的紅色破布，
a worn out banner that is barely readable. It says: 'Don't panic, follow instructions'. = 那是一條破舊得幾乎辨認不清的橫幅，上面寫着：“不要驚慌，聽從指揮”。
There were many banners, some were still on the walls but this one is on the ground. = 有許多橫幅至今仍掛在牆上，唯獨這一條，落在了地上。
He remembered it was 20 years ago, when he dragged that thing out of its storage and half-assedly nailed it down there in haste. = 他想起二十年前，自己把這玩意從倉庫裏拖出來，火急火燎、草草釘在了那裏。
If not for the suit and gloves on him, he could see the wrinkles on his hands. = 若非這身防護服與手套遮體，他定能瞧見自己滿手的皺紋。
And this time he nailed something right. = 而這一回，他終於釘對了一回。
'Welcome to the surface! Comrade.' = “歡迎重返地表！同志。”
Remnant: Surface = 餘波·重返地表

As we attempt to establish our surface life again, human civilization has changed all its faces to adapt to the conditions, and opening trade to a bunch of cannibals, mutants and, worst of all, landlords is a fearsome concept that many of us struggle to face. An important general assembly is being held to discuss our attitude toward the wasteland. = 當我們重又在這片大地上立足，人類文明為適應環境早已面目全非。同食人魔、變種人，乃至最令人不齒的地主之流通商往來，這等光景令許多人如鯁在喉、難以面對。一場關乎我們對廢土態度的重大全會，正在召開。
Pre-war culture, ideologies and moral standards should give place to pragmatic approaches. = 戰前的文化、意識形態與道德準則，當讓位於實事求是、務求實效的方針。
New Medium and High [International Reputation] buff: = 新增中、高 [International Reputation] 增益：
Trade, although limited, must be established. And we should also increase our awareness of the danger from infiltration. = 通商往來雖屬權宜，卻勢在必行；同時更要擦亮眼睛，嚴防滲透之患。
New High [Party Unity] buff: = 新增高 [Party Unity] 增益：
And we can reach an equilibrium with the prior experience of building a mixed economy. = 憑藉往昔建設混合經濟的經驗，我們可以左右兼顧、求得平衡。
Gain both of the buffs above. = 兼得上述兩項增益。
Fate of China: Realisation = 中國之命運·覺察

There are many important historical documents and other knowledge in the safe confines of [The Underground Great Wall]. Preserving them was one of our top priorities; now that we have recovered the ability to reproduce copies, what inspiration could we take from them? People need an idea they can get behind, the army needs a goal worth fighting for. = [The Underground Great Wall] 的深宮密室裏，珍藏着無數重要史籍文獻與知識瑰寶。保安它們，曾是我們的頭等大事。如今重獲複製刊行之力，我們能從中汲取怎樣的啟示？人民需要一面可以追隨的旗幟，軍隊需要一個值得為之戰鬥的目標。
The Great Reunification shall continue! = 統一大業，薪火不滅！
[+25/+50]% Strength against any other self-proclaimed Chinese faction = 對任何自稱的華夏勢力，戰力提升 [+25/+50]%
Chinese civilization will persevere. = 中華文明，生生不息。
[+1/+2] [Science] and [Culture] from each Trade Route = 每條貿易路線提供 [+1/+2] [Science] 與 [Culture]
This is a Protracted War against the totality of capitalism and imperialism's wrongs. = 這是一場針對資本主義及帝國主義全部罪孽的持久戰。
We will rebuild the motherland brick by brick. = 重建祖國，一磚一瓦。
Fate of China: Revision = 中國之命運·複習

We can do better = 百尺竿頭，更進一步。
There is still a long way ahead = 前路漫漫，來日方長。
Revision:Double Choice Available = 複習·雙選可用

Through extensive research and reconstruction, we have revitalised our national defense industry. However, we need to construct a tactical framework to get use out of our military technology. Our generals are arguing at the conference non-stop. = 歷經艱苦卓絕的科研與重建，我國國防工業已重煥生機。然則，尚需為我們的軍事技術構築一套戰術框架，方能物盡其用。眾將帥於會場之上，爭得不可開交。
Light infantry and drones would serve as the bulk of the force to rapidly infiltrate the front line. = 當以輕步兵與無人機為骨幹，疾如閃電地滲透前線。
And other units will follow through. = 其餘部隊隨後跟進，一鼓作氣。
